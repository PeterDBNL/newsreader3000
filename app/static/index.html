<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsreader3000</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233b82f6'/><text x='16' y='22' font-size='13' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>3K</text></svg>">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">📰 Newsreader3000</div>
  <nav id="nav">
    <a data-view="browse">Browse</a>
    <a data-view="search">Search</a>
    <a data-view="groups">Groups</a>
    <a data-view="downloads">Downloads <span id="qcount" class="badge hidden"></span></a>
    <a data-view="history">History</a>
    <a data-view="settings">Settings</a>
  </nav>
  <div class="statusbar">
    <span id="tasksind" class="tasks hidden" title="Background tasks"></span>
    <span id="speed">0 B/s</span>
    <button id="pauseall" class="small" title="Pause / resume all downloads">Pause</button>
  </div>
</header>
<main id="main"></main>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="close" onclick="closeModal()">✕</button><div id="modal-body"></div></div></div>
<div id="toasts"></div>
<script src="/static/app.js"></script>
</body>
</html>
