name: CI

# Runs the tests on every push/PR and publishes ghcr.io/<owner>/newsreader3000
# when a `v*` tag is pushed (or when run manually).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools used by post-processing tests
        run: sudo apt-get update && sudo apt-get install -y par2 unrar rar p7zip-full
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Image names and tags
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGES="ghcr.io/$OWNER/newsreader3000"
          # Docker Hub is used only when the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are set
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            IMAGES="$IMAGES docker.io/$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')/newsreader3000"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSIONS="${GITHUB_REF#refs/tags/v} latest"
          else
            VERSIONS="dev"
          fi
          TAGS=""
          for i in $IMAGES; do for v in $VERSIONS; do TAGS="$TAGS,$i:$v"; done; done
          echo "tags=${TAGS#,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: steps.meta.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
